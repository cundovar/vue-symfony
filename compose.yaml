name: my_project

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/symfony
    env_file:
      - .env
    expose:
      - "9000"
    networks: [connectPerso]

  front:
    build:
      context: ./front
    working_dir: /app
    volumes:
      - ./front:/app:cached
      - front_node_modules:/app/node_modules
      - ./public/build/.vite:/app/public/build/.vite
    ports:
      - "5173:5173"
    command: npm run dev:dock
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - VITE_DEV_ORIGIN=${VITE_DEV_ORIGIN:-http://localhost:8092}
    networks: [connectPerso]

  # (optionnel) front-build pour produire /public/build
  front-build:
    build:
      context: ./front
    working_dir: /app
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - ./public/build:/app/public/build
      - ./public/spa:/app/public/spa
    command: >-
      sh -c "npm run build && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000}
      /app/public/build /app/public/spa"
    networks: [connectPerso]


  # Micro-service résultats de QCM (Node + MongoDB), équivalent local du déploiement Coolify
  qcm-results:
    image: node:22.21.0-alpine
    working_dir: /app
    environment:
      - MONGODB_URL=mongodb://qcm-mongo:27017
      - MONGODB_DB=devdoc
      - QCM_RESULTS_API_KEY=${QCM_RESULTS_API_KEY:-local-dev-key-qcm-results-0123456789}
    volumes:
      - ./services/qcm-results:/app
      - qcm_results_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm start"
    depends_on:
      - qcm-mongo
    networks: [connectPerso]

  # MongoDB local : non publié sur l'hôte, joignable seulement par le réseau Docker
  qcm-mongo:
    image: mongo:7.0.25
    volumes:
      - qcm_mongo_data:/data/db
    networks: [connectPerso]

  # Documentation technique (VitePress) : `make docs-dev` sur http://localhost:5174, hors du démarrage normal
  docs:
    image: node:22.21.0-bookworm
    working_dir: /app/docs
    profiles: [docs]
    volumes:
      - ./:/app
      - docs_node_modules:/app/docs/node_modules
    ports:
      - "5174:5174"
    # git sert à la date « Mis à jour » de chaque page ; le dépôt monté appartient à un autre utilisateur
    command: sh -c "git config --global --add safe.directory /app && npm ci --no-audit --no-fund && npx vitepress dev --host 0.0.0.0 --port 5174"

  # Tests de bout en bout (Playwright) : `make test-e2e`, hors du démarrage normal (profil e2e)
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    working_dir: /e2e
    # Réseau de l'hôte : l'application est visée en http://localhost (contexte sécurisé pour le service worker)
    network_mode: host
    environment:
      - E2E_BASE_URL=http://localhost:${HOST_HTTP_PORT:-8092}
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    command: >-
      sh -c "npm ci --no-audit --no-fund && npx playwright test; status=$$?;
      chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /e2e/test-results /e2e/playwright-report 2>/dev/null; exit $$status"

  # mcp-node: (désactivé - MCP tourne en local via Claude Code)
  #   build:
  #     context: ../microservice/mcp-node
  #     dockerfile: Dockerfile
  #   working_dir: /app
  #   volumes:
  #     - ../microservice/mcp-node:/app
  #   env_file:
  #     - ../microservice/mcp-node/.env
  #   depends_on:
  #     - nginx
  #   ports:
  #     - "4100:4100"
  #   networks: [connectPerso]

  nginx:
    image: nginx:stable
    ports:
      - "${HOST_HTTP_PORT:-8092}:80"
    depends_on:
      - php
    volumes:
      - .:/var/www/symfony
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # <— configuration nginx
    networks: [connectPerso]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: courTotal
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [connectPerso]

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks: [connectPerso]

  storybook:
    build:
      context: ./front
    working_dir: /app
    volumes:
      - ./front:/app:cached
      - front_node_modules:/app/node_modules
    ports:
      - "6006:6006"
    command: npm run storybook:dock
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
    networks: [connectPerso]


networks:
  connectPerso:
    driver: bridge

volumes:
  mysql_data:
  front_node_modules:
  e2e_node_modules:
  docs_node_modules:
  qcm_results_node_modules:
  qcm_mongo_data:
