parameters:
    app.url: 'http://localhost:8080'
    app.user_page_visit.enabled: '%env(bool:USER_PAGE_VISIT_ENABLED)%'
    # Chemin SPA - Modifier cette valeur pour changer le préfixe
    # Note: Modifier aussi les Routes dans SpaController.php et SitemapController.php
    app.spa_path: '/spa'

services:
    App\Doctrine\PrefixedNamingStrategy:
        arguments:
            $prefix: 'appy_'
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Doctrine/'

    # Listener pour nettoyer automatiquement les anciennes visites
    App\EventListener\UserPageVisitListener:
        tags:
            - { name: doctrine.event_listener, event: postPersist }

    # ===== ARCHITECTURE HEXAGONALE =====

    # Infrastructure Services (doit être défini AVANT les bindings)
    App\Infrastructure\Note\Service\NoteEncryptionService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Infrastructure\Note\Repository\DoctrineNoteRepository: ~

    # Domain -> Infrastructure bindings (Note)
    App\Domain\Note\Repository\NoteRepositoryInterface: '@App\Infrastructure\Note\Repository\DoctrineNoteRepository'
    App\Domain\Note\Service\NoteEncryptionInterface: '@App\Infrastructure\Note\Service\NoteEncryptionService'

    # Infrastructure Services (Favorite)
    App\Infrastructure\Favorite\Repository\DoctrineFavoriteRepository: ~
    App\Infrastructure\Page\Repository\DoctrinePageRepository: ~
    App\Infrastructure\Category\Repository\DoctrineCategoryRepository: ~
    App\Infrastructure\UserPageVisit\Repository\DoctrineUserPageVisitRepository: ~
    App\Infrastructure\Menu\Repository\DoctrineMenuRepository: ~
    App\Infrastructure\Seo\Repository\DoctrineSeoRepository: ~
    App\Infrastructure\PositionMenu\Repository\DoctrinePositionMenuRepository: ~
    App\Infrastructure\CourseLevel\Repository\DoctrineCourseLevelRepository: ~
    App\Infrastructure\PageContent\Repository\DoctrinePageContentRepository: ~
    App\Infrastructure\ExoContent\Repository\DoctrineExoContentRepository: ~
    App\Infrastructure\ExoMenu\Repository\DoctrineExoMenuRepository: ~
    App\Infrastructure\Exo\Repository\DoctrineExoRepository: ~
    App\Infrastructure\QCM\Repository\DoctrineQCMRepository: ~
    App\Infrastructure\UserCustomization\Repository\DoctrineUserCustomizationRepository: ~
    App\Infrastructure\SiteConfiguration\Repository\DoctrineSiteConfigurationRepository: ~
    App\Infrastructure\LanguageQCM\Repository\DoctrineLanguageQCMRepository: ~
    App\Infrastructure\NiveauQCM\Repository\DoctrineNiveauQCMRepository: ~
    App\Infrastructure\ChoicesQCM\Repository\DoctrineChoicesQCMRepository: ~
    App\Infrastructure\PropositionIA\Repository\DoctrinePropositionIARepository: ~
    App\Infrastructure\User\Repository\DoctrineUserRepository: ~
    App\Infrastructure\PageBlock\Repository\DoctrinePageBlockRepository: ~
    App\Infrastructure\ExoBlock\Repository\DoctrineExoBlockRepository: ~
    App\Infrastructure\SuperMenu\Repository\DoctrineSuperMenuRepository: ~
    App\Infrastructure\DocDeCode\Repository\DoctrineDocDeCodeRepository: ~
    App\Infrastructure\Logo\Repository\DoctrineLogoRepository: ~
    App\Infrastructure\Persistence\DoctrinePersistenceFlusher: ~
    App\Infrastructure\Persistence\DoctrineTransactionalExecutor: ~
    App\Infrastructure\AgentCourseRevision\Repository\DoctrineAgentCourseRevisionRepository: ~

    # Domain -> Infrastructure bindings (Favorite)
    App\Domain\Favorite\Repository\FavoriteRepositoryInterface: '@App\Infrastructure\Favorite\Repository\DoctrineFavoriteRepository'
    App\Domain\Page\Repository\PageRepositoryInterface: '@App\Infrastructure\Page\Repository\DoctrinePageRepository'
    App\Domain\Category\Repository\CategoryRepositoryInterface: '@App\Infrastructure\Category\Repository\DoctrineCategoryRepository'
    App\Domain\UserPageVisit\Repository\UserPageVisitRepositoryInterface: '@App\Infrastructure\UserPageVisit\Repository\DoctrineUserPageVisitRepository'
    App\Domain\Menu\Repository\MenuRepositoryInterface: '@App\Infrastructure\Menu\Repository\DoctrineMenuRepository'
    App\Domain\Seo\Repository\SeoRepositoryInterface: '@App\Infrastructure\Seo\Repository\DoctrineSeoRepository'
    App\Domain\PositionMenu\Repository\PositionMenuRepositoryInterface: '@App\Infrastructure\PositionMenu\Repository\DoctrinePositionMenuRepository'
    App\Domain\CourseLevel\Repository\CourseLevelRepositoryInterface: '@App\Infrastructure\CourseLevel\Repository\DoctrineCourseLevelRepository'
    App\Domain\PageContent\Repository\PageContentRepositoryInterface: '@App\Infrastructure\PageContent\Repository\DoctrinePageContentRepository'
    App\Domain\ExoContent\Repository\ExoContentRepositoryInterface: '@App\Infrastructure\ExoContent\Repository\DoctrineExoContentRepository'
    App\Domain\ExoMenu\Repository\ExoMenuRepositoryInterface: '@App\Infrastructure\ExoMenu\Repository\DoctrineExoMenuRepository'
    App\Domain\Exo\Repository\ExoRepositoryInterface: '@App\Infrastructure\Exo\Repository\DoctrineExoRepository'
    App\Domain\QCM\Repository\QCMRepositoryInterface: '@App\Infrastructure\QCM\Repository\DoctrineQCMRepository'
    App\Domain\UserCustomization\Repository\UserCustomizationRepositoryInterface: '@App\Infrastructure\UserCustomization\Repository\DoctrineUserCustomizationRepository'
    App\Domain\SiteConfiguration\Repository\SiteConfigurationRepositoryInterface: '@App\Infrastructure\SiteConfiguration\Repository\DoctrineSiteConfigurationRepository'
