# Penpot auto-hébergé pour les maquettes et le design system (outil local, hors application).
# Adapté du fichier officiel : https://github.com/penpot/penpot/blob/main/docker/images/docker-compose.yaml
# Différences : version figée, ports liés à 127.0.0.1, télémétrie coupée, pas de redémarrage
# automatique, clé secrète lue dans penpot.local.env (généré par `make design-up`, non versionné).
#
# Usage : make design-up | make design-down | make design-logs
# Interface : http://localhost:9001 — MCP distant : http://localhost:9001/mcp/stream?userToken=<clé MCP>

x-flags: &penpot-flags
  # Usage strictement local : pas de vérification d'e-mail ni de cookies sécurisés (HTTP).
  PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: http://localhost:9001

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: penpot

name: devdoc-penpot

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: penpotapp/frontend:2.18.3
    ports:
      - "127.0.0.1:9001:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-admin-console
      - penpot-mcp
      - penpot-exporter
    networks:
      - penpot
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000

  penpot-backend:
    image: penpotapp/backend:2.18.3
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    env_file: penpot.local.env
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: no-reply@penpot.localhost
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@penpot.localhost
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"

  penpot-admin-console:
    image: penpotapp/admin-console:2.18.3
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - penpot
    env_file: penpot.local.env
    environment:
      <<: [*penpot-public-uri, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-mcp:
    image: penpotapp/mcp:2.18.3
    networks:
      - penpot

  penpot-exporter:
    image: penpotapp/exporter:2.18.3
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    env_file: penpot.local.env
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: postgres:15.14
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot

  penpot-valkey:
    image: valkey/valkey:8.1
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  # Serveur SMTP factice : les e-mails envoyés par Penpot sont lisibles sur http://localhost:1080
  penpot-mailcatch:
    image: sj26/mailcatcher:v0.10.0
    expose:
      - "1025"
    ports:
      - "127.0.0.1:1080:1080"
    networks:
      - penpot
