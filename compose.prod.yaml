services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
    volumes:
      - .:/var/www/symfony
      - ./var/cache:/var/www/symfony/var/cache
      - ./var/log:/var/www/symfony/var/log
    networks:
      - connectPerso

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/symfony
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      php:
        condition: service_started
      front-build:
        condition: service_completed_successfully
    networks:
      - connectPerso

  front-build:
    build:
      context: ./front
    working_dir: /app
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - ./public/build:/app/public/build
      - ./public/spa:/app/public/spa
    command: >-
      sh -c "npm run build && chown -R ${HOST_UID:-1000}:${HOST_GID:-1000}
      /app/public/build /app/public/spa"
    networks:
      - connectPerso

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: courTotal5
    ports:
      - "3307:3306"
    networks:
      - connectPerso
    volumes:
      - ./mysql_data:/var/lib/mysql

networks:
  connectPerso:
    driver: bridge

volumes:
  mysql_data:
  front_node_modules:
